name: Sync Goose data

# Keeps the live site current by re-pulling elgoose.net into the database. The
# web app only reads, so all writes happen here, out of band.

on:
  schedule:
    # Daily at 09:12 UTC (early morning in the US). Off the top of the hour, as
    # GitHub recommends, to avoid the cron stampede.
    - cron: "12 9 * * *"
  workflow_dispatch: {} # manual "Run workflow" button on the Actions tab

# Never let two syncs overlap.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply schema migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
      - name: Sync elgoose → database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELGOOSE_USER_AGENT: "GooseIndex/1.0 (+https://github.com/tsvb/goose-index; nightly sync)"
        run: npm run sync
      - name: Verify integrity
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run verify

      # verify checks the database against itself. This checks it against
      # elgoose — the only way to catch the cache drifting from the source
      # (a show refiled onto another tour, a date moved, a show withdrawn).
      # Read-only.
      - name: Audit against elgoose
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELGOOSE_USER_AGENT: "GooseIndex/1.0 (+https://github.com/tsvb/goose-index; nightly source audit)"
        run: npm run audit-source

      # nugs's catalog is a second, independent source. Runs LAST — after
      # verify/audit have checked the primary elgoose data — so a nugs-side
      # failure (shape change, new auth wall) can't skip integrity checks on
      # the data that matters most; it still fails the job loudly on its own.
      - name: Import nugs catalog → database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NUGS_USER_AGENT: "GooseIndex/1.0 (+https://github.com/tsvb/goose-index; nightly nugs import)"
        run: npm run import-nugs

      # Drop the site's one-hour query cache so tonight's write is visible
      # immediately.
      #
      # This step never fails the run. By the time it happens the data work is
      # done and committed, and the worst a missed bust costs is an hour of
      # staleness — whereas a red nightly run for a cache that will expire on
      # its own is an alert that trains you to ignore alerts. It goes amber
      # instead, which is what "the sync worked, the courtesy call didn't" is.
      # The window where the secret is set here but not yet on Vercel (deploy
      # step 3 vs step 5 in docs/DEPLOY.md) lands here as a 501, not a failure.
      - name: Refresh the site's query cache
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET unset; catalog cache expires on its own (≤1h)"
            exit 0
          fi
          status=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            https://www.gooseindex.com/api/revalidate || echo "000")
          case "$status" in
            200) echo "Catalog cache dropped." ;;
            501) echo "::warning::/api/revalidate is disabled (REVALIDATE_SECRET unset on Vercel); cache expires on its own (≤1h)" ;;
            401) echo "::warning::/api/revalidate rejected the secret; it differs from the one on Vercel. Cache expires on its own (≤1h)" ;;
            000) echo "::warning::/api/revalidate unreachable; cache expires on its own (≤1h)" ;;
            *)   echo "::warning::/api/revalidate returned $status; cache expires on its own (≤1h)" ;;
          esac
